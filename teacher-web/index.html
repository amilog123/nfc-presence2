<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFCPresence – Professeur</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f172a;
      --surface:   #1e293b;
      --border:    #334155;
      --text:      #f1f5f9;
      --muted:     #94a3b8;
      --accent:    #38bdf8;
      --uid-bg:    #1c3048;
      --uid-color: #fbbf24;
      --green:     #4ade80;
      --red:       #f87171;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* ── Login ─────────────────────────────────────────── */

    #login {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    #login .logo {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    #login h1 {
      font-size: 1.5rem;
      margin-bottom: 0.25rem;
    }

    #login p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    #login input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      margin-bottom: 0.75rem;
    }

    #login input:focus { border-color: var(--accent); }

    button {
      width: 100%;
      padding: 0.75rem;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:disabled { opacity: 0.5; cursor: default; }

    .msg {
      margin-top: 1rem;
      font-size: 0.9rem;
      min-height: 1.4em;
    }

    .msg.ok  { color: var(--green); }
    .msg.err { color: var(--red); }

    /* ── Dashboard ─────────────────────────────────────── */

    #dashboard { width: 100%; max-width: 860px; display: none; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
    }

    .header-left h2 { font-size: 1.1rem; color: var(--muted); font-weight: 400; }
    .header-left span { font-size: 1.3rem; font-weight: 700; }

    #refresh-status {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: right;
    }

    #countdown {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      display: block;
    }

    /* Session card */
    .session-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem 2.5rem;
      margin-bottom: 1.5rem;
    }

    .session-card.active { border-color: var(--accent); }

    .session-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.25rem 0.75rem;
      border-radius: 99px;
      margin-bottom: 1rem;
    }

    .badge-active   { background: rgba(56,189,248,0.15); color: var(--accent); }
    .badge-upcoming { background: rgba(148,163,184,0.1); color: var(--muted); }

    .session-title {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    .session-meta {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .session-meta div { color: var(--muted); font-size: 1rem; }
    .session-meta strong { color: var(--text); font-size: 1.15rem; display: block; }

    /* NFC UID */
    .uid-block {
      background: var(--uid-bg);
      border: 1px solid rgba(251,191,36,0.3);
      border-radius: 12px;
      padding: 1.5rem 2rem;
    }

    .uid-label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .uid-value {
      font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      font-weight: 700;
      color: var(--uid-color);
      letter-spacing: 0.06em;
      word-break: break-all;
    }

    /* Empty state */
    #empty {
      text-align: center;
      padding: 4rem 2rem;
      display: none;
    }

    #empty .icon { font-size: 4rem; margin-bottom: 1rem; }
    #empty h3 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    #empty p { color: var(--muted); }

    /* Logout */
    #logout-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 500;
      width: auto;
      padding: 0.4rem 1rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <!-- ── Login ───────────────────────────────────────────── -->
  <div id="login">
    <div class="logo">📡</div>
    <h1>NFCPresence</h1>
    <p>Connectez-vous pour afficher l'UID NFC de votre session.</p>
    <input type="email" id="email-input" placeholder="Votre adresse email" autocomplete="email">
    <button id="login-btn" onclick="sendMagicLink()">Recevoir le lien de connexion</button>
    <p class="msg" id="login-msg"></p>
  </div>

  <!-- ── Dashboard ───────────────────────────────────────── -->
  <div id="dashboard">
    <div class="header">
      <div class="header-left">
        <h2>Bonjour,</h2>
        <span id="teacher-name">—</span>
      </div>
      <div id="refresh-status">
        <span id="countdown">30</span>
        Prochaine mise à jour
      </div>
    </div>

    <div id="sessions-container"></div>

    <div id="empty">
      <div class="icon">📅</div>
      <h3>Aucune session aujourd'hui</h3>
      <p>Revenez lorsqu'un cours vous est assigné.</p>
    </div>

    <button id="logout-btn" onclick="logout()">Se déconnecter</button>
  </div>

  <script>
    // ── Config ──────────────────────────────────────────────
    const SUPABASE_URL      = 'https://your-project-id.supabase.co';
    const SUPABASE_ANON_KEY = 'your-anon-key-here';

    // ── State ───────────────────────────────────────────────
    let authToken  = localStorage.getItem('nfc_teacher_token');
    let teacherID  = localStorage.getItem('nfc_teacher_id');
    let teacherName = localStorage.getItem('nfc_teacher_name');
    let refreshTimer;
    let countdownTimer;
    let countdown = 30;

    // ── Startup ─────────────────────────────────────────────
    (function init() {
      const hash = window.location.hash;
      if (hash.includes('access_token')) {
        const params = new URLSearchParams(hash.slice(1));
        const token = params.get('access_token');
        if (token) {
          authToken = token;
          localStorage.setItem('nfc_teacher_token', token);
          history.replaceState(null, '', window.location.pathname);
        }
      }

      if (authToken) {
        loadDashboard();
      } else {
        show('login');
      }
    })();

    // ── Auth ────────────────────────────────────────────────
    async function sendMagicLink() {
      const email = document.getElementById('email-input').value.trim();
      if (!email) return;

      const btn = document.getElementById('login-btn');
      const msg = document.getElementById('login-msg');
      btn.disabled = true;
      msg.className = 'msg';
      msg.textContent = 'Envoi en cours…';

      try {
        const res = await supabaseFetch('/auth/v1/otp', {
          method: 'POST',
          body: { email, create_user: false },
          auth: false,
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        msg.className = 'msg ok';
        msg.textContent = '✉️ Lien envoyé – vérifiez vos emails.';
      } catch (e) {
        msg.className = 'msg err';
        msg.textContent = 'Erreur : ' + e.message;
        btn.disabled = false;
      }
    }

    function logout() {
      ['nfc_teacher_token', 'nfc_teacher_id', 'nfc_teacher_name'].forEach(k =>
        localStorage.removeItem(k)
      );
      clearInterval(refreshTimer);
      clearInterval(countdownTimer);
      authToken = teacherID = teacherName = null;
      show('login');
    }

    // ── Dashboard ────────────────────────────────────────────
    async function loadDashboard() {
      show('dashboard');

      if (!teacherID) {
        await resolveTeacher();
      } else {
        document.getElementById('teacher-name').textContent = teacherName ?? '—';
      }

      await fetchAndRender();
      startAutoRefresh();
    }

    async function resolveTeacher() {
      try {
        const email = decodeJWT(authToken).email;
        const res   = await supabaseFetch(`/rest/v1/teachers?email=eq.${encodeURIComponent(email)}&limit=1`);
        if (!res.ok) throw new Error();
        const [teacher] = await res.json();
        if (!teacher) throw new Error('Aucun professeur trouvé pour cet email.');
        teacherID   = teacher.id;
        teacherName = teacher.nom;
        localStorage.setItem('nfc_teacher_id',   teacherID);
        localStorage.setItem('nfc_teacher_name', teacherName);
        document.getElementById('teacher-name').textContent = teacherName;
      } catch (e) {
        document.getElementById('teacher-name').textContent = 'Compte introuvable';
      }
    }

    async function fetchAndRender() {
      if (!teacherID) return;

      const today = new Date().toISOString().slice(0, 10);

      try {
        const res = await supabaseFetch(
          `/rest/v1/sessions?teacher_id=eq.${teacherID}&date=eq.${today}&order=creneau.asc`
        );
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const sessions = await res.json();
        render(sessions);
      } catch (e) {
        console.error('Erreur fetch sessions :', e);
      }
    }

    function render(sessions) {
      const container = document.getElementById('sessions-container');
      const empty     = document.getElementById('empty');

      if (!sessions.length) {
        container.innerHTML = '';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      const now     = new Date();
      const hour    = now.getHours() + now.getMinutes() / 60;
      const isMatin = hour < 13;

      container.innerHTML = sessions.map(s => {
        const isActive = (s.creneau === 'matin' && isMatin) ||
                         (s.creneau === 'apres-midi' && !isMatin);
        const creneauLabel = s.creneau === 'matin' ? 'Matin' : 'Après-midi';
        const dateLabel    = new Date(s.date + 'T12:00:00').toLocaleDateString('fr-FR', {
          weekday: 'long', day: 'numeric', month: 'long'
        });

        return `
          <div class="session-card ${isActive ? 'active' : ''}">
            <span class="session-badge ${isActive ? 'badge-active' : 'badge-upcoming'}">
              ${isActive ? '● En cours' : '○ ' + creneauLabel}
            </span>
            <div class="session-title">${esc(s.titre)}</div>
            <div class="session-meta">
              <div><div>Salle</div><strong>${esc(s.salle)}</strong></div>
              <div><div>Créneau</div><strong>${creneauLabel}</strong></div>
              <div><div>Date</div><strong>${dateLabel}</strong></div>
            </div>
            <div class="uid-block">
              <div class="uid-label">🏷 UID du badge NFC</div>
              <div class="uid-value">${esc(s.nfc_tag_uid)}</div>
            </div>
          </div>`;
      }).join('');
    }

    // ── Auto-refresh ─────────────────────────────────────────
    function startAutoRefresh() {
      countdown = 30;
      updateCountdown();

      refreshTimer   = setInterval(async () => {
        await fetchAndRender();
        countdown = 30;
      }, 30_000);

      countdownTimer = setInterval(() => {
        countdown = Math.max(0, countdown - 1);
        updateCountdown();
      }, 1_000);
    }

    function updateCountdown() {
      document.getElementById('countdown').textContent = countdown + 's';
    }

    // ── Helpers ──────────────────────────────────────────────
    function supabaseFetch(path, { method = 'GET', body, auth = true } = {}) {
      const headers = {
        'apikey':       SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        'Accept':       'application/json',
      };
      if (auth && authToken) headers['Authorization'] = 'Bearer ' + authToken;

      return fetch(SUPABASE_URL + path, {
        method,
        headers,
        body: body ? JSON.stringify(body) : undefined,
      });
    }

    function decodeJWT(token) {
      try {
        const payload = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(atob(payload));
      } catch { return {}; }
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(screen) {
      document.getElementById('login').style.display     = screen === 'login'     ? 'block' : 'none';
      document.getElementById('dashboard').style.display = screen === 'dashboard' ? 'block' : 'none';
    }
  </script>
</body>
</html>
